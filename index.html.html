<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase v9 (modular) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyD51HWHYqCphYr1S8f2vgHKWFzLddll-r0",
            authDomain: "inventario-bolsa.firebaseapp.com",
            projectId: "inventario-bolsa",
            storageBucket: "inventario-bolsa.firebasestorage.app",
            messagingSenderId: "483475056799",
            appId: "1:483475056799:web:76260bab6f19f70d389aaa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.firebaseDB = {
            getDoc: (path) => getDoc(doc(db, 'inventario', path)),
            setDoc: (path, data) => setDoc(doc(db, 'inventario', path), data),
            onSnapshot: (path, callback) => onSnapshot(doc(db, 'inventario', path), callback)
        };

        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebaseReady'));
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const useFirebaseData = () => {
            const [datos, setDatos] = useState(null);
            const [conectado, setConectado] = useState(false);
            const [cargando, setCargando] = useState(true);

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.firebaseReady) {
                        await new Promise(resolve => {
                            window.addEventListener('firebaseReady', resolve, { once: true });
                        });
                    }

                    try {
                        const docSnap = await window.firebaseDB.getDoc('datos');
                        
                        if (docSnap.exists()) {
                            setDatos(docSnap.data());
                            setConectado(true);
                        } else {
                            const datosIniciales = {
                                marcas: ['Sandy', 'Manantial', 'Aguagol', 'Ozono', 'Doral', 'Chucky', 'Galeras', 'Fresh Water'],
                                trabajadores: [
                                    { nombre: 'Andrea', produccion: { 'Sandy': 1500, 'Manantial': 300, 'Aguagol': 500 } },
                                    { nombre: 'Sebastian', produccion: { 'Ozono': 100, 'Doral': 700, 'Chucky': 1000 } },
                                    { nombre: 'Ricardo', produccion: { 'Ozono': 1000, 'Galeras': 500, 'Fresh Water': 700 } }
                                ],
                                ventas: { 'Ozono': 300 },
                                historial: [
                                    { fecha: new Date().toISOString(), tipo: 'produccion', trabajador: 'Andrea', marca: 'Sandy', cantidad: 1500 },
                                    { fecha: new Date().toISOString(), tipo: 'venta', marca: 'Ozono', cantidad: 300 }
                                ]
                            };
                            await window.firebaseDB.setDoc('datos', datosIniciales);
                            setDatos(datosIniciales);
                            setConectado(true);
                        }

                        window.firebaseDB.onSnapshot('datos', (doc) => {
                            if (doc.exists()) {
                                setDatos(doc.data());
                                setConectado(true);
                            }
                        });

                    } catch (error) {
                        console.error('Error Firebase:', error);
                        setConectado(false);
                        alert('Error al conectar con Firebase. Verifica tu configuración y las reglas de seguridad.');
                    } finally {
                        setCargando(false);
                    }
                };

                initFirebase();
            }, []);

            const actualizarDatos = async (nuevosDatos) => {
                try {
                    await window.firebaseDB.setDoc('datos', nuevosDatos);
                } catch (error) {
                    console.error('Error al actualizar:', error);
                    alert('Error al guardar. Verifica tu conexión a internet.');
                }
            };

            return { datos, actualizarDatos, conectado, cargando };
        };

        function App() {
            const { datos, actualizarDatos, conectado, cargando } = useFirebaseData();
            const [vista, setVista] = useState('admin');
            const [trabajadorActual, setTrabajadorActual] = useState('');
            const [marcaSeleccionada, setMarcaSeleccionada] = useState('');
            const [cantidad, setCantidad] = useState('');
            const [marcaVenta, setMarcaVenta] = useState('');
            const [cantidadVenta, setCantidadVenta] = useState('');
            const [nuevoTrabajador, setNuevoTrabajador] = useState('');
            const [nuevaMarca, setNuevaMarca] = useState('');
            const [mostrarExito, setMostrarExito] = useState(false);

            if (cargando) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-20 w-20 border-b-4 border-blue-600 mx-auto mb-4"></div>
                            <p className="text-2xl font-bold text-gray-700">Conectando con Firebase...</p>
                            <p className="text-sm text-gray-500 mt-2">Esto puede tomar unos segundos</p>
                        </div>
                    </div>
                );
            }

            if (!datos) {
                return (
                    <div className="min-h-screen bg-red-50 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-lg shadow-lg max-w-md">
                            <h2 className="text-2xl font-bold text-red-600 mb-4">❌ Error de Conexión</h2>
                            <p className="text-gray-700 mb-4">No se pudo conectar con Firebase.</p>
                            <div className="bg-yellow-50 border-l-4 border-yellow-500 p-4 mb-4">
                                <p className="font-semibold mb-2">Verifica lo siguiente:</p>
                                <ul className="list-disc list-inside text-sm space-y-1">
                                    <li>Creaste Firestore Database en Firebase</li>
                                    <li>Configuraste las reglas en modo de prueba</li>
                                    <li>Tienes conexión a internet</li>
                                </ul>
                            </div>
                            <button onClick={() => window.location.reload()} className="w-full bg-blue-600 text-white py-2 rounded-lg">
                                Reintentar
                            </button>
                        </div>
                    </div>
                );
            }

            const calcularInventarioTotal = () => {
                const inventario = {};
                datos.marcas.forEach(marca => { inventario[marca] = 0; });
                datos.trabajadores.forEach(trabajador => {
                    Object.entries(trabajador.produccion || {}).forEach(([marca, cant]) => {
                        inventario[marca] = (inventario[marca] || 0) + cant;
                    });
                });
                Object.entries(datos.ventas || {}).forEach(([marca, cant]) => {
                    inventario[marca] = (inventario[marca] || 0) - cant;
                });
                return inventario;
            };

            const mostrarMensajeExito = () => {
                setMostrarExito(true);
                setTimeout(() => setMostrarExito(false), 2000);
            };

            const agregarTrabajador = () => {
                if (nuevoTrabajador.trim() && !datos.trabajadores.find(t => t.nombre === nuevoTrabajador)) {
                    actualizarDatos({
                        ...datos,
                        trabajadores: [...datos.trabajadores, { nombre: nuevoTrabajador, produccion: {} }]
                    });
                    setNuevoTrabajador('');
                    mostrarMensajeExito();
                }
            };

            const agregarMarca = () => {
                if (nuevaMarca.trim() && !datos.marcas.includes(nuevaMarca)) {
                    actualizarDatos({
                        ...datos,
                        marcas: [...datos.marcas, nuevaMarca]
                    });
                    setNuevaMarca('');
                    mostrarMensajeExito();
                }
            };

            const agregarProduccion = (trabajador, marca, cant) => {
                if (trabajador && marca && cant) {
                    const nuevosTrabajadores = datos.trabajadores.map(t => {
                        if (t.nombre === trabajador) {
                            return {
                                ...t,
                                produccion: {
                                    ...(t.produccion || {}),
                                    [marca]: ((t.produccion || {})[marca] || 0) + parseInt(cant)
                                }
                            };
                        }
                        return t;
                    });
                    const nuevoHistorial = [...(datos.historial || []), {
                        fecha: new Date().toISOString(),
                        tipo: 'produccion',
                        trabajador: trabajador,
                        marca: marca,
                        cantidad: parseInt(cant)
                    }];
                    actualizarDatos({
                        ...datos,
                        trabajadores: nuevosTrabajadores,
                        historial: nuevoHistorial
                    });
                    setCantidad('');
                    mostrarMensajeExito();
                }
            };

            const registrarVenta = () => {
                if (marcaVenta && cantidadVenta) {
                    const nuevasVentas = {
                        ...(datos.ventas || {}),
                        [marcaVenta]: ((datos.ventas || {})[marcaVenta] || 0) + parseInt(cantidadVenta)
                    };
                    const nuevoHistorial = [...(datos.historial || []), {
                        fecha: new Date().toISOString(),
                        tipo: 'venta',
                        marca: marcaVenta,
                        cantidad: parseInt(cantidadVenta)
                    }];
                    actualizarDatos({
                        ...datos,
                        ventas: nuevasVentas,
                        historial: nuevoHistorial
                    });
                    setCantidadVenta('');
                    mostrarMensajeExito();
                }
            };

            const inventarioTotal = calcularInventarioTotal();
            const totalProducido = Object.values(inventarioTotal).reduce((sum, val) => {
                const venta = datos.ventas[datos.marcas.find(m => inventarioTotal[m] === val)] || 0;
                return sum + Math.max(0, val + venta);
            }, 0);
            const totalVendido = Object.values(datos.ventas || {}).reduce((a, b) => a + b, 0);

            const formatearFecha = (fecha) => {
                const d = new Date(fecha);
                return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            };

            // VISTA TRABAJADOR
            if (vista === 'trabajador') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 p-4">
                        <div className="max-w-2xl mx-auto">
                            {mostrarExito && (
                                <div className="fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-bounce">
                                    ✓ Guardado exitosamente
                                </div>
                            )}
                            <div className="bg-white rounded-2xl shadow-xl p-6 mb-4">
                                <div className="flex items-center justify-between mb-4">
                                    <h1 className="text-2xl font-bold text-gray-800">📝 Registro de Producción</h1>
                                    <div className={`flex items-center gap-2 ${conectado ? 'text-green-600' : 'text-red-600'}`}>
                                        <div className="w-3 h-3 rounded-full bg-current animate-pulse"></div>
                                        <span className="text-sm font-semibold">{conectado ? 'Online' : 'Offline'}</span>
                                    </div>
                                </div>
                                {!trabajadorActual ? (
                                    <div>
                                        <p className="text-gray-600 mb-4 text-lg">Selecciona tu nombre para comenzar:</p>
                                        <div className="grid gap-3">
                                            {datos.trabajadores.map(t => (
                                                <button
                                                    key={t.nombre}
                                                    onClick={() => setTrabajadorActual(t.nombre)}
                                                    className="bg-blue-600 text-white py-4 px-6 rounded-xl font-bold hover:bg-blue-700 transition-all text-lg shadow-lg hover:shadow-xl"
                                                >
                                                    👤 {t.nombre}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="flex justify-between items-center mb-6 bg-blue-50 p-4 rounded-lg">
                                            <h2 className="text-xl font-bold text-blue-800">👋 Hola, {trabajadorActual}</h2>
                                            <button onClick={() => setTrabajadorActual('')} className="text-blue-600 hover:text-blue-800 font-semibold text-sm">
                                                Cambiar usuario
                                            </button>
                                        </div>
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-2">Marca de agua</label>
                                                <select 
                                                    value={marcaSeleccionada}
                                                    onChange={(e) => setMarcaSeleccionada(e.target.value)}
                                                    className="w-full p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none text-lg font-medium"
                                                >
                                                    <option value="">-- Seleccionar marca --</option>
                                                    {datos.marcas.map(m => (
                                                        <option key={m} value={m}>{m}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-2">Cantidad de bolsas producidas</label>
                                                <input 
                                                    type="number"
                                                    value={cantidad}
                                                    onChange={(e) => setCantidad(e.target.value)}
                                                    placeholder="Ejemplo: 500"
                                                    className="w-full p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none text-lg"
                                                />
                                            </div>
                                            <button 
                                                onClick={() => {
                                                    agregarProduccion(trabajadorActual, marcaSeleccionada, cantidad);
                                                    setMarcaSeleccionada('');
                                                }}
                                                disabled={!marcaSeleccionada || !cantidad}
                                                className="w-full bg-green-600 text-white py-4 rounded-xl font-bold hover:bg-green-700 transition-all text-lg shadow-lg disabled:bg-gray-400 disabled:cursor-not-allowed"
                                            >
                                                ✓ Registrar Producción
                                            </button>
                                        </div>
                                        <div className="mt-6 pt-6 border-t-2">
                                            <h3 className="font-bold text-gray-800 mb-3 text-lg">📊 Tu producción de hoy:</h3>
                                            <div className="space-y-2">
                                                {Object.entries(datos.trabajadores.find(t => t.nombre === trabajadorActual)?.produccion || {}).map(([marca, cant]) => (
                                                    <div key={marca} className="flex justify-between bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-lg border-l-4 border-blue-500">
                                                        <span className="font-semibold text-gray-700">{marca}</span>
                                                        <span className="font-bold text-blue-700 text-lg">{cant} bolsas</span>
                                                    </div>
                                                ))}
                                                {Object.keys(datos.trabajadores.find(t => t.nombre === trabajadorActual)?.produccion || {}).length === 0 && (
                                                    <p className="text-gray-500 text-center py-4">Aún no has registrado producción</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}
                                <button onClick={() => setVista('admin')} className="mt-6 w-full bg-gray-600 text-white py-3 rounded-xl font-bold hover:bg-gray-700 transition-all shadow-lg">
                                    🏠 Volver al Panel Principal
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // VISTA CONFIGURACIÓN
            if (vista === 'configuracion') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-100 p-4">
                        <div className="max-w-4xl mx-auto">
                            {mostrarExito && (
                                <div className="fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-bounce">
                                    ✓ Guardado exitosamente
                                </div>
                            )}
                            <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                                <h1 className="text-3xl font-bold text-gray-800">⚙️ Configuración</h1>
                                <p className="text-gray-600 mt-2">Administra trabajadores y marcas</p>
                            </div>
                            <div className="grid md:grid-cols-2 gap-6">
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-4">👥 Trabajadores</h2>
                                    <div className="flex gap-2 mb-6">
                                        <input 
                                            type="text"
                                            value={nuevoTrabajador}
                                            onChange={(e) => setNuevoTrabajador(e.target.value)}
                                            placeholder="Nombre completo"
                                            className="flex-1 p-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                        />
                                        <button onClick={agregarTrabajador} className="bg-green-600 text-white px-6 rounded-lg font-bold hover:bg-green-700 shadow-lg">
                                            + Agregar
                                        </button>
                                    </div>
                                    <div className="space-y-2">
                                        <p className="text-sm font-semibold text-gray-600 mb-2">Total: {datos.trabajadores.length} trabajadores</p>
                                        {datos.trabajadores.map(t => (
                                            <div key={t.nombre} className="bg-gray-50 p-4 rounded-lg flex justify-between items-center border-l-4 border-green-500">
                                                <span className="font-semibold">{t.nombre}</span>
                                                <span className="text-sm text-gray-600 bg-white px-3 py-1 rounded-full">
                                                    {Object.keys(t.produccion || {}).length} marcas
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-4">💧 Marcas de Agua</h2>
                                    <div className="flex gap-2 mb-6">
                                        <input 
                                            type="text"
                                            value={nuevaMarca}
                                            onChange={(e) => setNuevaMarca(e.target.value)}
                                            placeholder="Nueva marca"
                                            className="flex-1 p-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                        />
                                        <button onClick={agregarMarca} className="bg-blue-600 text-white px-6 rounded-lg font-bold hover:bg-blue-700 shadow-lg">
                                            + Agregar
                                        </button>
                                    </div>
                                    <div>
                                        <p className="text-sm font-semibold text-gray-600 mb-2">Total: {datos.marcas.length} marcas</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            {datos.marcas.map(m => (
                                                <div key={m} className="bg-gradient-to-br from-blue-50 to-indigo-50 p-3 rounded-lg text-center font-semibold text-blue-800 border-2 border-blue-200">
                                                    {m}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button onClick={() => setVista('admin')} className="mt-6 w-full bg-gray-600 text-white py-3 rounded-xl font-bold hover:bg-gray-700 shadow-lg">
                                🏠 Volver al Panel Principal
                            </button>
                        </div>
                    </div>
                );
            }

            // VISTA ADMIN
            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-7xl mx-auto">
                        {mostrarExito && (
                            <div className="fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-bounce">
                                ✓ Guardado exitosamente
                            </div>
                        )}
                        <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-800 mb-2">📦 Sistema de Inventario</h1>
                                    <div className="flex items-center gap-2">
                                        <div className={`w-3 h-3 rounded-full ${conectado ? 'bg-green-500' : 'bg-red-500'} animate-pulse`}></div>
                                        <span className="text-sm font-semibold text-gray-600">
                                            {conectado ? '✓ Conectado a Firebase' : '✗ Sin conexión'}
                                        </span>
                                    </div>
                                </div>
                                <div className="flex flex-wrap gap-3">
                                    <button onClick={() => setVista('trabajador')} className="bg-green-600 text-white px-5 py-3 rounded-lg font-bold hover:bg-green-700 shadow-lg">
                                        👥 Modo Trabajador
                                    </button>
                                    <button onClick={() => setVista('configuracion')} className="bg-purple-600 text-white px-5 py-3 rounded-lg font-bold hover:bg-purple-700 shadow-lg">
                                        ⚙️ Configuración
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                            <div className="bg-white rounded-xl shadow-lg p-5 border-l-4 border-blue-500">
                                <p className="text-xs text-gray-600 font-semibold mb-1">Total Producido</p>
                                <p className="text-3xl font-bold text-blue-700">{totalProducido}</p>
                                <p className="text-xs text-gray-500 mt-1">bolsas</p>
                            </div>
                            <div className="bg-white rounded-xl shadow-lg p-5 border-l-4 border-red-500">
                                <p className="text-xs text-gray-600 font-semibold mb-1">Total Vendido</p>
                                <p className="text-3xl font-bold text-red-700">{totalVendido}</p>
                                <p className="text-xs text-gray-500 mt-1">bolsas</p>
                            </div>
                            <div className="bg-white rounded-xl shadow-lg p-5 border-l-4 border-green-500">
                                <p className="text-xs text-gray-600 font-semibold mb-1">Trabajadores</p>
                                <p className="text-3xl font-bold text-green-700">{datos.trabajadores.length}</p>
                                <p className="text-xs text-gray-500 mt-1">activos</p>
                            </div>
                            <div className="bg-white rounded-xl shadow-lg p-5 border-l-4 border-yellow-500">
                                <p className="text-xs text-gray-600 font-semibold mb-1">Fecha</p>
                                <p className="text-lg font-bold text-yellow-700">{new Date().toLocaleDateString('es-ES')}</p>
                                <p className="text-xs text-gray-500 mt-1">{new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'})}</p>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">🔻 Registrar Ventas del Día</h2>
                            <div className="grid md:grid-cols-3 gap-4">
                                <select value={marcaVenta} onChange={(e) => setMarcaVenta(e.target.value)} className="p-3 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none font-medium">
                                    <option value="">-- Seleccionar marca --</option>
                                    {datos.marcas.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                                <input 
                                    type="number"
                                    value={cantidadVenta}
                                    onChange={(e) => setCantidadVenta(e.target.value)}
                                    placeholder="Cantidad vendida"
                                    className="p-3 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none"
                                />
                                <button 
                                    onClick={registrarVenta}
                                    disabled={!marcaVenta || !cantidadVenta}
                                    className="bg-red-600 text-white py-3 rounded-lg font-bold hover:bg-red-700 shadow-lg disabled:bg-gray-400 disabled:cursor-not-allowed"
                                >
                                    Registrar Venta
                                </button>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">📊 Inventario Actual por Marca</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                {datos.marcas.map(marca => (
                                    <div key={marca} className="bg-gradient-to-br from-blue-50 to-indigo-50 p-4 rounded-lg border-2 border-blue-300 shadow-md">
                                        <p className="text-sm font-semibold text-gray-600">{marca}</p>
                                        <p className="text-3xl font-bold text-blue-700">{inventarioTotal[marca] || 0}</p>
                                        <p className="text-xs text-gray-500">bolsas disponibles</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">👷 Producción por Trabajador</h2>
                            <div className="space-y-3">
                                {datos.trabajadores.map(trabajador => (
                                    <div key={trabajador.nombre} className="border-2 border-gray-200 rounded-lg p-4 hover:border-blue-300 transition-all">
                                        <h3 className="font-bold text-lg text-gray-800 mb-3 flex items-center gap-2">
                                            <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">
                                                {trabajador.nombre}
                                            </span>
                                            <span className="text-sm text-gray-500">
                                                ({Object.values(trabajador.produccion || {}).reduce((a, b) => a + b, 0)} bolsas totales)
                                            </span>
                                        </h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                            {Object.entries(trabajador.produccion || {}).map(([marca, cant]) => (
                                                <div key={marca} className="bg-gray-50 p-3 rounded border-l-4 border-blue-500">
                                                    <p className="text-xs text-gray-600 font-medium">{marca}</p>
                                                    <p className="text-lg font-bold text-gray-800">{cant}</p>
                                                </div>
                                            ))}
                                            {Object.keys(trabajador.produccion || {}).length === 0 && (
                                                <p className="col-span-full text-gray-400 text-sm text-center py-2">Sin producción registrada</p>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                📅 Historial de Movimientos
                                <span className="text-sm font-normal text-gray-500">
                                    ({(datos.historial || []).length} registros)
                                </span>
                            </h2>
                            <div className="space-y-2 max-h-96 overflow-y-auto">
                                {(datos.historial || []).slice().reverse().slice(0, 30).map((item, idx) => (
                                    <div key={idx} className={`p-4 rounded-lg border-l-4 ${item.tipo === 'produccion' ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'} shadow-sm`}>
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <p className="font-bold text-sm text-gray-800">
                                                    {item.tipo === 'produccion' ? '✓ Producción' : '✗ Venta'} - {item.marca}
                                                </p>
                                                {item.trabajador && <p className="text-xs text-gray-600 mt-1">👤 {item.trabajador}</p>}
                                                <p className="text-xs text-gray-500 mt-1">🕐 {formatearFecha(item.fecha)}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-2xl font-bold text-gray-800">{item.cantidad}</p>
                                                <p className="text-xs text-gray-500">bolsas</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {(datos.historial || []).length === 0 && (
                                    <div className="text-center py-8 text-gray-400">
                                        <p className="text-lg">📝 No hay movimientos registrados aún</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
